name: myntra-prod-b21

on: workflow_dispatch

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: docker build
        run: docker build -t myntra-prod-b21 .

      - name: check docker image
        run: docker images 

      - name: configure aws keys
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: push docker image to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 497617901838.dkr.ecr.ap-south-1.amazonaws.com
          docker tag myntra-prod-b21:latest 497617901838.dkr.ecr.ap-south-1.amazonaws.com/myntra:latest
          docker push 497617901838.dkr.ecr.ap-south-1.amazonaws.com/myntra:latest

      - name: deploy to EKS
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name test
          kubectl apply -f k8s/app/*
          






    

    



