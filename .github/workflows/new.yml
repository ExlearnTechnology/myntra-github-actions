name: test

on: push 

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    #   - name: list code
    #     run: |
    #       git clone https://github.com/ExlearnTechnology/myntra-github-actions.git
    #       cd myntra-github-actions
    #       ls -la

        - name: Checkout source code
          uses: actions/checkout@v3

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v2
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ap-south-1

        - name: Log in to Amazon ECR
          run: |
                aws ecr get-login-password --region ap-south-1 | \
                docker login --username AWS --password-stdin 497617901838.dkr.ecr.ap-south-1.amazonaws.com

        - name: Build Docker image
          run: |
                docker build -t 497617901838.dkr.ecr.ap-south-1.amazonaws.com/myntra:v1
                

